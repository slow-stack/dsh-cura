name: release

# 推 v* 标签就发版：先跑双平台测试，再校验 tag 与 package.json 版本一致，
# 然后 npm publish，最后用 .github/scripts/release-body.mjs 拼好的正文建 Release。
# 正文格式固定成「描述 / 本次变更 / 安装 / 链接」四段，别在 workflow 里手改文案。
#
# 想先看效果再真发？手动触发时勾上 dry_run：标签可以还没建（就是拿来试格式的），
# 照样跑测试与全部校验，把 Release 标题和正文打到日志里，但不碰 npm、不建 Release。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发版的标签（演练模式下可以填一个还不存在的）'
        required: true
      dry_run:
        description: '只演练：不发 npm、不建 Release'
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

# 按「目标标签」而不是按 ref 分组：演练 v0.10.0 和真推 v0.10.0 落在同一组里，
# 免得演练还没跑完，真发版就跟它抢同一个版本号。
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
  DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}

# 注意：env 上下文在 step 的 with: 里不可用，所以检出用的 ref 只能就地写表达式。
# 演练时标签可能还不存在，只能检出当前分支；真实发版才检出标签本身。

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.dry_run == 'true' && github.ref_name || github.event.inputs.tag || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # 与 test.yml 同一套装法：--omit=peer 是必须的，装上 peer 会盖掉
      # rules-remote 的降级路径，测到的就不是真实形状了。
      - name: 安装依赖
        run: npm install --omit=peer --no-audit --no-fund --package-lock=false

      - name: 跑单测
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            while IFS= read -r line; do
              echo "::error::$line"
            done < <(grep -E "^(========== FAIL|FAIL |[0-9]+ 套失败)" test.log | head -20)
          fi
          exit "$status"

  publish:
    name: publish to npm
    needs: [test]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      published: ${{ steps.check.outputs.published }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.dry_run == 'true' && github.ref_name || github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: 读版本号
        id: version
        run: |
          ver="$(node -p "require('./package.json').version")"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "package.json version = $ver"

      # 标签写错是发版最常见的翻车方式：v0.9.0 的标签挂着 0.8.0 的代码，
      # 发出去之后 registry 上那个版本号就永远对不上了（不能重发）。
      - name: 校验 tag 与 package.json 版本一致
        run: |
          tag="${RELEASE_TAG#v}"
          ver="$(node -p "require('./package.json').version")"
          echo "tag=$tag version=$ver"
          if [ "$tag" != "$ver" ]; then
            echo "::error::tag ${RELEASE_TAG} does not match package.json version $ver"
            exit 1
          fi

      - name: 查 registry 上是否已有这个版本
        id: check
        run: |
          ver="$(node -p "require('./package.json').version")"
          name="$(node -p "require('./package.json').name")"
          echo "checking $name@$ver on the registry"
          if npm view "$name@$ver" version >/dev/null 2>&1; then
            echo "$ver 已经发过了，跳过 publish"
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 演练模式：不发 npm
        if: env.DRY_RUN == 'true'
        run: |
          name="$(node -p "require('./package.json').name")"
          ver="$(node -p "require('./package.json').version")"
          if [ "${{ steps.check.outputs.published }}" = "true" ]; then
            echo "演练模式：本来会执行 npm publish --access public --provenance（$name@$ver），这次跳过"
          else
            echo "演练模式：$name@$ver 在 registry 上已经有了，真实发版也会跳过 publish"
          fi

      - name: 发到 npm
        if: steps.check.outputs.published == 'true' && env.DRY_RUN != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::仓库没有配 NPM_TOKEN，发不出去"
            exit 1
          fi
          npm publish --access public --provenance

      - name: 发完回查一次
        if: steps.check.outputs.published == 'true' && env.DRY_RUN != 'true'
        run: |
          ver="$(node -p "require('./package.json').version")"
          name="$(node -p "require('./package.json').name")"
          # registry 有 CDN 延迟，npm 自己会说 "may take a few minutes to become
          # available"。0.9.0 只等 30 秒就判失败；0.9.2 等满 4 分钟（24 × 10s）
          # 仍然判失败，而包其实在 4 分 11 秒就上去了——只差了 11 秒。
          # 4 分钟的窗口比 CDN 的实际抖动还紧，所以放到 10 分钟（60 × 10s）。
          # 10 分钟还查不到才当作「真的没上去」，这时已经不是 CDN 延迟的问题了。
          for i in $(seq 1 60); do
            if npm view "$name@$ver" version --prefer-online >/dev/null 2>&1; then
              echo "$name@$ver 已在 registry 上（第 $i 次查询命中）"
              exit 0
            fi
            echo "第 $i/60 次没查到，10 秒后重试"
            sleep 10
          done
          echo "::error::npm publish 报告成功，但 10 分钟后 registry 上仍查不到 $name@$ver（这已经不是 CDN 延迟了）"
          exit 1

  release:
    name: create GitHub release
    # 必须等 publish：发不出去就不该先挂出一个 Release
    needs: [test, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.dry_run == 'true' && github.ref_name || github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 收集本次变更的提交
        id: commits
        run: |
          # 演练模式下这个标签往往还没建（就是拿来试格式的），
          # 那就用当前检出点当终点，照样能看出正文长什么样。
          base="${RELEASE_TAG}"
          if ! git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null; then
            echo "标签 ${RELEASE_TAG} 还不存在，用当前检出点代替"
            base="HEAD"
          fi
          # 找上一个 tag 作为比较起点；没有就列全部历史。
          prev="$(git describe --tags --abbrev=0 "${base}^" 2>/dev/null || true)"
          if [ -n "$prev" ]; then
            echo "上一个 tag: $prev"
            git log --pretty=format:'%s' "$prev..${base}" > commits.txt
          else
            echo "没有上一个 tag，列出全部历史"
            git log --pretty=format:'%s' "$base" > commits.txt
          fi
          echo "previous=$prev" >> "$GITHUB_OUTPUT"
          # 别用 wc -l 数 commits.txt：git log --pretty=format: 末尾不补换行，
          # 5 条提交只会数出 4 条。rev-list --count 才是准的。
          if [ -n "$prev" ]; then
            echo "共 $(git rev-list --count "$prev..${base}") 条提交"
          else
            echo "共 $(git rev-list --count "$base") 条提交"
          fi

      # 补发老标签时，那个 tag 的树里可能还没有这个脚本（脚本是后加的），
      # 就从默认分支取一份；取不到才退化成 GitHub 自动生成的说明。
      - name: 取正文生成脚本
        run: |
          if [ ! -f .github/scripts/release-body.mjs ]; then
            mkdir -p .github/scripts
            git show "origin/${{ github.event.repository.default_branch }}:.github/scripts/release-body.mjs" > .github/scripts/release-body.mjs
            echo "已从默认分支取到 release-body.mjs"
          fi

      - name: 生成 Release 标题与正文
        run: |
          node .github/scripts/release-body.mjs \
            --pkg package.json \
            --version "${{ needs.publish.outputs.version }}" \
            --tag "${RELEASE_TAG}" \
            --previous "${{ steps.commits.outputs.previous }}" \
            --commits-file commits.txt \
            --out release-body.md \
            --title-out release-title.txt

      - name: 演练模式：把标题与正文打出来
        if: env.DRY_RUN == 'true'
        run: |
          echo "标题：$(cat release-title.txt)"
          echo "---------- 正文开始 ----------"
          cat release-body.md
          echo "---------- 正文结束 ----------"
          echo "演练模式：不建 Release。确认没问题就去推这个标签，同一条流水线会真发。"

      - name: 建 Release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} 已存在，不再重复建"
            exit 0
          fi
          gh release create "${RELEASE_TAG}" \
            --title "$(cat release-title.txt)" \
            --notes-file release-body.md \
            --verify-tag
